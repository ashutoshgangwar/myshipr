apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.myshipr"

    defaultConfig {
        applicationId "com.myshipr"
        // HERE SDK Navigate 4.27 requires API 24+ (see its bundled manifest).
        minSdkVersion Math.max(24, rootProject.ext.minSdkVersion as int)
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // HERE credentials are NOT declared here. They are read from .env by JS
        // and passed to SDKNativeEngine.makeSharedInstance() through
        // HereSdk.initialize(), so .env stays the single source of truth.
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: "AIzaSyDH6IejmpyYR5CpKxBEBmeLe_tbG6voOjg"
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true

            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ),
            "proguard-rules.pro"
        }
    }

    splits {
        abi {
            enable true
            reset()

            include 'armeabi-v7a', 'arm64-v8a'

            universalApk true
        }
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {

    implementation("com.facebook.react:react-android")

    // HERE SDK Navigate ships as a local .aar in android/app/libs. Picking it up
    // by fileTree rather than by exact artifact name means dropping in a newer
    // heresdk-navigate-android-*.aar needs no Gradle edit — just delete the old
    // one so exactly one HERE .aar remains in the folder.
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    implementation "com.google.android.gms:play-services-location:21.0.1"
    implementation 'com.caverock:androidsvg-aar:1.4'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}