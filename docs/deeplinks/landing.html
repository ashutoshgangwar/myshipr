<!DOCTYPE html>
<!--
  Landing page for the driver invite link.
  Serve at one route:

      https://<link-host>/d/activate

  There is no emailed password-reset link. A driver who forgets their password
  uses "Forgot Password" inside the app, which sends an OTP and never a link.

  Two situations reach this page:

    App installed, domain verified → the OS opens MyShipr before the browser
      ever loads this file, so the driver never sees it.
    App not installed, or domain not yet verified → this page loads. It offers
      "Open in app" (custom scheme) first, and the store below it.

  The custom scheme myshipr:// appears HERE and nowhere else. It must never go
  in the email itself — Gmail and Outlook render it as dead text.

  This page must not log, store, or forward the token. It is in the URL only so
  the app can pick it up. No analytics, no tag manager, no third-party script.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Open MyShipr</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      main { padding: 24px; max-width: 420px; width: 100%; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #94a3b8; line-height: 1.5; margin: 0 0 24px; }
      a.btn {
        display: block;
        padding: 14px 20px;
        margin-bottom: 12px;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary { background: transparent; border: 1px solid #334155; color: #cbd5e1; }
      #hint { font-size: 13px; margin: 16px 0 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Set your MyShipr password</h1>
      <p id="lede">Tap below to open the MyShipr app and choose your password.</p>

      <a class="btn" id="open" href="#">Open in app</a>
      <a class="btn secondary" id="store" href="#">I don't have the app yet</a>

      <p id="hint" hidden>
        Nothing happened? Install MyShipr first, then tap the link in your email
        again.
      </p>
    </main>

    <script>
      (function () {
        // ---- CONFIG — the only lines DevOps edits ----------------------------
        var SCHEME = 'myshipr';
        var ANDROID_PACKAGE = 'com.myshipr';
        var APPLE_APP_ID = ''; // e.g. '6478123456'. Empty until the app is on
                               // the App Store; iOS then falls back to the site.
        var FALLBACK_URL = 'https://myshipr.com';
        // ---------------------------------------------------------------------

        var ANDROID_STORE =
          'https://play.google.com/store/apps/details?id=' + ANDROID_PACKAGE;
        var IOS_STORE = APPLE_APP_ID
          ? 'https://apps.apple.com/app/id' + APPLE_APP_ID
          : FALLBACK_URL;

        var ua = navigator.userAgent || '';
        // iPadOS 13+ reports itself as a Mac, so the touch-point check is what
        // actually catches modern iPads.
        var isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/.test(ua);

        function param(name) {
          var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
          return m ? m[1] : ''; // kept percent-encoded — it is re-emitted as-is
        }

        // One action: activate. The app also accepts the aliases /d/invite and
        // /d/set-password, so a link built with either still resolves.
        var token = param('token') || param('t');
        var deepLink =
          SCHEME + '://activate' + (token ? '?token=' + token : '');

        var openBtn = document.getElementById('open');
        var storeBtn = document.getElementById('store');

        openBtn.href = deepLink;
        storeBtn.href = isIOS ? IOS_STORE : ANDROID_STORE;

        // A link with no token cannot do anything in the app.
        if (!token) {
          openBtn.hidden = true;
          document.getElementById('lede').textContent =
            'This link is incomplete. Please open the link from your email, or ' +
            'ask your carrier to send a new one.';
        }

        // Desktop: the scheme is useless here, so say so plainly.
        if (!isIOS && !isAndroid) {
          openBtn.hidden = true;
          storeBtn.hidden = true;
          document.getElementById('lede').textContent =
            'Open this link on your phone to set your MyShipr password.';
        } else {
          // If the scheme handler is missing, the page simply stays put — show
          // the install hint once the driver has had a moment to be switched away.
          openBtn.addEventListener('click', function () {
            setTimeout(function () {
              if (!document.hidden) {
                document.getElementById('hint').hidden = false;
              }
            }, 1200);
          });
        }
      })();
    </script>
  </body>
</html>
